version: "3.8"
services:
  app:
    image: renewaa_next:0.1.0
    build:
      context: ./
      dockerfile: Dockerfile
    volumes:
      - .:/renewaa
      - /renewaa/node_modules
      - /renewaa/.next
      - /renewaa/.yarn
    environment:
      NEXT_PUBLIC_EMAIL_RECEIVER: info@renewaa.com
      NEXT_PUBLIC_EMAIL_SENDER: contactrenewaa@gmail.com
      NEXT_PUBLIC_EMAIL_SENDER_PWD: cbmiwsibpnpmjfrd
      DATABASE_URL: mysql://root:rootpassword@db:3306/renewaa
      SECRET_KEY: 1a2b3c4d5e6f7g8h9i
      NEXT_PUBLIC_HOSTNAME: http://localhost:3000
      NEXT_PUBLIC_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db
    restart: always
  db:
    image: mysql:8.0.36
    ports:
      - 3306:3306
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: renewaa
      MYSQL_USER: user
      MYSQL_PASSWORD: password
volumes:
  db_data:
