name: Run Tests and Vulnerability Scan

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package-manager: [npm, yarn]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ "${{ matrix.package-manager }}" == "npm" ]; then
            npm install --legacy-peer-deps
          else
            yarn install
          fi
        shell: bash

      - name: Remove unnecessary type definitions
        run: |
          if [ "${{ matrix.package-manager }}" == "npm" ]; then
            npm uninstall @types/next-auth
          else
            yarn remove @types/next-auth
          fi
        shell: bash

      - name: Run tests
        run: |
          if [ "${{ matrix.package-manager }}" == "npm" ]; then
            npm test
          else
            if yarn run | grep -q "test"; then
              yarn test
            else
              echo "No test script found in package.json for yarn."
              exit 1
            fi
          fi
        shell: bash

  vulnerability-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        shell: bash

      - name: Remove unnecessary type definitions
        run: npm uninstall @types/next-auth
        shell: bash

      - name: Attempt to fix vulnerabilities
        run: npm audit fix --force
        shell: bash

      - name: Run npm audit
        run: npm audit --audit-level=high
        shell: bash
